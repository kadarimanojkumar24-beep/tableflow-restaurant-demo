<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TableFlow | Kitchen</title><style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#172033;--muted:#718096;--line:#e7ebf2;--brand:#5b5bd6;--brand2:#4444b8;--green:#16865b;--orange:#c47716;--red:#c43d4b;--shadow:0 8px 28px #1c2b4a0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;background:var(--brand);color:#fff;font-weight:650}button:hover{background:var(--brand2)}button.secondary{background:#eef0ff;color:#4545b8}button.ghost{background:#f1f3f7;color:#39445a}button.danger{background:#fff0f1;color:var(--red)}button.success{background:#e8f7ef;color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand{font-size:19px;font-weight:850;letter-spacing:-.5px}.brand span{color:var(--brand)}.topright{display:flex;align-items:center;gap:10px}.pill{font-size:11px;font-weight:750;padding:4px 8px;border-radius:20px;background:#eef0ff;color:#4b4bc2}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.navlabel{font-size:10px;color:#9aa4b5;font-weight:800;letter-spacing:1.1px;padding:12px 10px 7px}.navbtn{width:100%;text-align:left;background:transparent;color:#5a6578;margin:2px 0;font-weight:600}.navbtn:hover,.navbtn.active{background:#f0f0ff;color:var(--brand)}main{padding:25px;max-width:1500px;width:100%;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.pagehead h1{font-size:25px;margin:0 0 4px;letter-spacing:-.6px}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow);min-width:0}.stat{font-size:26px;font-weight:800;margin-top:5px}.statlabel{font-size:12px;color:var(--muted)}.section{margin-top:20px}.section h2{font-size:16px;margin:0 0 12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted)}.small{font-size:12px}.tablegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.tabletile{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;cursor:pointer}.tabletile:hover{border-color:var(--brand)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.available{background:#eaf8f0}.occupied{background:#fff4e6}.attention{background:#fff0f1}.status{font-size:11px;font-weight:750;border-radius:20px;padding:4px 8px;display:inline-block;background:#eef1f6;color:#586477}.s-pending{background:#fff3df;color:#9b6412}.s-approved,.s-preparing{background:#e9efff;color:#4358b9}.s-ready,.s-paid,.s-served{background:#e7f7ef;color:#14744e}.s-delayed,.s-cancelled{background:#fff0f1;color:#b52e40}.s-occupied{background:#fff3df;color:#9b6412}.s-available{background:#e7f7ef;color:#14744e}
.list{display:flex;flex-direction:column;gap:9px}.item{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff}.item h3{margin:0;font-size:14px}.item p{margin:4px 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}input,select,textarea{border:1px solid #dce2ec;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink);width:100%;min-width:0}label{display:block;font-size:12px;font-weight:700;color:#596579;margin-bottom:5px}.field{margin:10px 0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.menuGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.food{overflow:hidden;padding:0}.food .foodemoji{height:105px;background:#f4f1eb;display:grid;place-items:center;font-size:48px}.foodbody{padding:12px}.price{font-weight:800}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 9px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#eef0f5;color:#596579}.tabs button.active{background:var(--brand);color:#fff}.notice{padding:11px 13px;border-radius:10px;background:#eef3ff;color:#4656a5;margin:10px 0}.warning{background:#fff5e7;color:#936018}.successbox{background:#eaf8f0;color:#176d4b}.hidden{display:none!important}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.cartline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.total{font-size:20px;font-weight:850}.bar{height:7px;border-radius:10px;background:#edf0f5;overflow:hidden}.bar>span{display:block;height:100%;background:var(--brand)}.modalback{position:fixed;inset:0;background:#17203380;z-index:20;display:grid;place-items:center;padding:16px}.modal{background:#fff;border-radius:15px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 14px}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;z-index:40;box-shadow:var(--shadow);max-width:340px}.empty{text-align:center;padding:25px;color:var(--muted)}.customerwrap{max-width:1000px;margin:auto}.customerhead{background:#fff;padding:18px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}.receipt{font-family:Arial,sans-serif;color:#111;padding:16px;border:1px dashed #aaa;background:#fff}.receipt h2{text-align:center}.receipt table{width:100%;border-collapse:collapse}.receipt td{padding:6px 0;border-bottom:1px solid #ddd}.right{text-align:right}.footer{font-size:11px;color:var(--muted);text-align:center;margin:28px 0 10px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:8px;gap:5px}.navlabel{display:none}.navbtn{width:auto;white-space:nowrap;margin:0}.split{grid-template-columns:1fr}main{padding:16px}.top{padding:0 14px}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:12px}.pagehead{display:block}.pagehead button{margin-top:10px}.formgrid{grid-template-columns:1fr}.topright .muted{display:none}}

.solo.layout{grid-template-columns:1fr}.solo aside{display:none}.qrcell{text-align:center;padding:14px;break-inside:avoid}.qrcell svg{width:100%;max-width:200px;height:auto}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}.cols h2{font-size:14px}.tipbtn.active{background:var(--brand);color:#fff}.tab-badge{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;margin-left:5px;font-size:11px}
@media print{.noprint,aside,.top{display:none!important}body *{visibility:visible}.layout{display:block}}
</style></head><body>
<header class="top noprint"><div class="brand">Table<span>Flow</span> <span class="pill">Kitchen</span></div><div class="topright"><span class="muted small" id="clock"></span><button class="ghost" onclick="resetDemo()">Reset demo</button></div></header>
<div class="layout solo"><aside id="nav"></aside><main id="app"></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>

const KEY='tableflow_v2';
const seed=()=>({settings:{restaurant:'The TableFlow Kitchen',address:'Main Road, Andhra Pradesh',phone:'+91 90000 00000',gst:5,service:0,upi:'restaurant@upi'},menu:[
{id:1,name:'Chicken Biryani',category:'Biryani',price:250,emoji:'🍛',desc:'Aromatic basmati rice with chicken',available:true,veg:false},
{id:2,name:'Veg Biryani',category:'Biryani',price:180,emoji:'🍚',desc:'Fragrant vegetable biryani',available:true,veg:true},
{id:3,name:'Chicken Lollipop',category:'Starters',price:180,emoji:'🍗',desc:'Crispy spicy chicken starter',available:true,veg:false},
{id:4,name:'Paneer Tikka',category:'Starters',price:160,emoji:'🥘',desc:'Grilled paneer with spices',available:true,veg:true},
{id:5,name:'Butter Naan',category:'Breads',price:40,emoji:'🫓',desc:'Soft butter naan',available:true,veg:true},
{id:6,name:'Chicken Curry',category:'Main Course',price:220,emoji:'🍲',desc:'Chicken curry gravy',available:true,veg:false},
{id:7,name:'Water Bottle',category:'Beverages',price:20,emoji:'💧',desc:'Packaged drinking water',available:true,veg:true},
{id:8,name:'Fresh Lime Soda',category:'Beverages',price:60,emoji:'🍹',desc:'Fresh lime soda',available:true,veg:true},
{id:9,name:'Vanilla Ice Cream',category:'Desserts',price:70,emoji:'🍨',desc:'Vanilla ice cream',available:true,veg:true},
{id:10,name:'Gulab Jamun',category:'Desserts',price:60,emoji:'🍮',desc:'Two pieces',available:true,veg:true}],tables:Array.from({length:8},(_,i)=>({id:i+1,status:'Available',sid:null})),staff:[{id:1,name:'Alex',role:'Waiter',tables:[1,2,3,4]},{id:2,name:'Sam',role:'Waiter',tables:[5,6,7,8]},{id:3,name:'Kitchen Team',role:'Kitchen',tables:[]}],orders:[],bills:[],alerts:[],nextOrder:1001,nextBill:5001});
let mem=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return mem?JSON.parse(mem):seed()}}
function save(){let s=JSON.stringify(db);mem=s;try{localStorage.setItem(KEY,s)}catch(e){}}
let db=load();
function mut(fn){db=load();fn();save()}
function tx(fn){mut(fn);render()}
addEventListener('storage',e=>{if(e.key===KEY){db=load();let a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&document.getElementById('modalRoot').innerHTML)return;render()}});
const $=id=>document.getElementById(id);
const money=n=>'₹'+Number(n||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sc=s=>'s-'+String(s).toLowerCase().replace(/ /g,'-');
function toast(s){$('toastRoot').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('toastRoot').innerHTML='',3200)}
function showModal(c){$('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${c}<div class="actions"><button class="ghost" onclick="closeModal()">Close</button></div></div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
const getTable=id=>db.tables.find(t=>t.id===Number(id));
const sum=items=>items.reduce((s,x)=>s+x.qty*x.price,0);
function totals(items){let sub=sum(items),gst=sub*db.settings.gst/100,svc=sub*db.settings.service/100;return{sub,gst,svc,total:sub+gst+svc}}
const activeOrders=()=>db.orders.filter(o=>!['Served','Cancelled'].includes(o.status));
const tableActive=id=>activeOrders().filter(o=>o.table===Number(id));
const timeLeft=o=>Math.max(0,Math.ceil((o.dueAt-Date.now())/60000));
const sessOrders=id=>{let t=getTable(id);return db.orders.filter(o=>o.table===Number(id)&&o.sid===t.sid)};
const billable=id=>sessOrders(id).filter(o=>o.status==='Served'&&!o.billId);
const openBills=id=>db.bills.filter(b=>b.table===Number(id)&&b.status==='Payment Requested');
const tableBusy=id=>tableActive(id).length||billable(id).length||openBills(id).length;
function addAlert(title,message,table){db.alerts.push({title,message,table,at:Date.now()});db.alerts=db.alerts.slice(-40)}
function seatTable(id){let t=getTable(id);if(t&&t.status==='Available'){t.status='Occupied';t.sid=Date.now();t.seatedAt=Date.now()}}
function mergeItems(os){let a=[];os.forEach(o=>o.items.forEach(i=>{let f=a.find(x=>x.id===i.id);f?f.qty+=i.qty:a.push({...i})}));return a}
function orderCard(o,btns=''){return `<div class="item"><div class="between"><div><h3>Order #${o.id} · Table ${o.table}</h3><p>${new Date(o.createdAt).toLocaleTimeString()} · ${esc(o.customer||'Guest')}${o.waiter?' · Waiter '+esc(o.waiter):''}</p></div><span class="status ${sc(o.status)}">${o.status}</span></div><p>${o.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</p>${o.notes?`<p>📝 ${esc(o.notes)}</p>`:''}<div class="between"><b>${money(sum(o.items))}</b><span class="small muted">${o.dueAt&&!['Ready','Served','Cancelled'].includes(o.status)?'ETA '+(timeLeft(o)>0?timeLeft(o)+' min':'overdue'):''}</span></div>${btns?`<div class="actions">${btns}</div>`:''}</div>`}
function head(t,s,b=''){return `<div class="pagehead"><div><h1>${t}</h1><div class="sub">${s}</div></div>${b}</div>`}
function stat(l,v,n=''){return `<div class="card"><div class="statlabel">${l}</div><div class="stat">${v}</div><div class="small muted">${n}</div></div>`}
function processReminders(){mut(()=>{for(const o of db.orders){if(!o.dueAt||['Ready','Served','Cancelled','Pending'].includes(o.status))continue;let l=timeLeft(o);for(const th of [10,5,0])if(l<=th&&!o.reminders.includes(th)){o.reminders.push(th);addAlert(th?'Order reminder':'ETA reached',`Order #${o.id}, Table ${o.table}: ${th?th+' min remaining':'estimated time reached'}.`,o.table)}if(Date.now()>o.dueAt&&o.status!=='Delayed'){o.status='Delayed';addAlert('Order delayed',`Order #${o.id}, Table ${o.table} is past its ETA.`,o.table)}}});render()}
function receiptHtml(b){return `<div class="receipt"><h2>${esc(db.settings.restaurant)}</h2><p style="text-align:center">${esc(db.settings.address)}<br>${esc(db.settings.phone)}</p><hr><p>Invoice ${b.id} · Table ${b.table}<br>${new Date(b.createdAt).toLocaleString()}</p><table>${b.items.map(i=>`<tr><td>${esc(i.name)} × ${i.qty}</td><td class="right">${money(i.price*i.qty)}</td></tr>`).join('')}<tr><td>Subtotal</td><td class="right">${money(b.sub)}</td></tr><tr><td>GST (${b.gstPct}%)</td><td class="right">${money(b.gst)}</td></tr><tr><td>Service</td><td class="right">${money(b.svc)}</td></tr><tr><td>Tip${b.waiter?' ('+esc(b.waiter)+')':''}</td><td class="right">${money(b.tip)}</td></tr><tr><td><b>Total</b></td><td class="right"><b>${money(b.total)}</b></td></tr></table><p>Payment: ${esc(b.method)} · ${b.status}</p><p style="text-align:center">Thank you for dining with us!</p></div>`}
function printReceipt(id){let b=db.bills.find(x=>x.id===id);if(!b)return;let w=open('','_blank');if(!w){toast('Allow pop-ups to print.');return}w.document.write(`<html><head><title>Receipt ${b.id}</title><style>body{font:14px Arial;padding:24px;max-width:420px;margin:auto}table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid #ddd}.right{text-align:right}</style></head><body>${receiptHtml(b)}<script>print()<\/script></body></html>`);w.document.close()}
function resetDemo(){if(!confirm('Reset ALL demo data for every view?'))return;db=seed();save();render();toast('Demo data reset.')}

function render(){let os=activeOrders().filter(o=>['Approved','Preparing','Delayed','Ready'].includes(o.status)),col=(t,st,btn)=>`<div><h2>${t} (${os.filter(o=>st.includes(o.status)).length})</h2><div class="list">${os.filter(o=>st.includes(o.status)).map(o=>orderCard(o,btn(o))).join('')||'<div class="empty">—</div>'}</div></div>`;
$('app').innerHTML=head('Kitchen Display','Only waiter-accepted orders appear here')+`<div class="cols">${col('New',['Approved'],o=>`<button onclick="st(${o.id},'Preparing')">Start preparing</button>`)}${col('Preparing / Delayed',['Preparing','Delayed'],o=>`${o.status==='Preparing'?`<button class="danger" onclick="st(${o.id},'Delayed')">Delayed</button>`:''}<button class="success" onclick="st(${o.id},'Ready')">Mark ready</button>`)}${col('Ready for waiter',['Ready'],o=>'')}</div>`}
const st=(id,s)=>tx(()=>{let o=db.orders.find(x=>x.id===id);o.status=s;if(s==='Ready'){o.readyAt=Date.now();addAlert('Order ready','Order #'+id+' for Table '+o.table+' is ready to serve.',o.table)}});
$('nav').remove();setInterval(processReminders,15000);

render();
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString()},5000);
</script></body></html>

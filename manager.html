function totals(items){let sub=sum(items),gst=sub*db.settings.gst/100,svc=sub*db.settings.service/100;return{sub,gst,svc,total:sub+gst+svc}}
const activeOrders=()=>db.orders.filter(o=>!['Served','Cancelled'].includes(o.status));
const tableActive=id=>activeOrders().filter(o=>o.table===Number(id));
const timeLeft=o=>Math.max(0,Math.ceil((o.dueAt-Date.now())/60000));
const sessOrders=id=>{let t=getTable(id);return db.orders.filter(o=>o.table===Number(id)&&o.sid===t.sid)};
const billable=id=>sessOrders(id).filter(o=>o.status==='Served'&&!o.billId);
const openBills=id=>db.bills.filter(b=>b.table===Number(id)&&b.status==='Payment Requested');
const tableBusy=id=>tableActive(id).length||billable(id).length||openBills(id).length;
function addAlert(title,message,table){db.alerts.push({title,message,table,at:Date.now()});db.alerts=db.alerts.slice(-40)}
function seatTable(id){let t=getTable(id);if(t&&t.status==='Available'){t.status='Occupied';t.sid=Date.now();t.seatedAt=Date.now()}}
function mergeItems(os){let a=[];os.forEach(o=>o.items.forEach(i=>{let f=a.find(x=>x.id===i.id);f?f.qty+=i.qty:a.push({...i})}));return a}
function orderCard(o,btns=''){return `<div class="item"><div class="between"><div><h3>Order #${o.id} · Table ${o.table}</h3><p>${new Date(o.createdAt).toLocaleTimeString()} · ${esc(o.customer||'Guest')}${o.waiter?' · Waiter '+esc(o.waiter):''}</p></div><span class="status ${sc(o.status)}">${o.status}</span></div><p>${o.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</p>${o.notes?`<p>📝 ${esc(o.notes)}</p>`:''}<div class="between"><b>${money(sum(o.items))}</b><span class="small muted">${o.dueAt&&!['Ready','Served','Cancelled'].includes(o.status)?'ETA '+(timeLeft(o)>0?timeLeft(o)+' min':'overdue'):''}</span></div>${btns?`<div class="actions">${btns}</div>`:''}</div>`}
function head(t,s,b=''){return `<div class="pagehead"><div><h1>${t}</h1><div class="sub">${s}</div></div>${b}</div>`}
function stat(l,v,n=''){return `<div class="card"><div class="statlabel">${l}</div><div class="stat">${v}</div><div class="small muted">${n}</div></div>`}
function processReminders(){mut(()=>{for(const o of db.orders){if(!o.dueAt||['Ready','Served','Cancelled','Pending'].includes(o.status))continue;let l=timeLeft(o);for(const th of [10,5,0])if(l<=th&&!o.reminders.includes(th)){o.reminders.push(th);addAlert(th?'Order reminder':'ETA reached',`Order #${o.id}, Table ${o.table}: ${th?th+' min remaining':'estimated time reached'}.`,o.table)}if(Date.now()>o.dueAt&&o.status!=='Delayed'){o.status='Delayed';addAlert('Order delayed',`Order #${o.id}, Table ${o.table} is past its ETA.`,o.table)}}});render()}
function receiptHtml(b){return `<div class="receipt"><h2>${esc(db.settings.restaurant)}</h2><p style="text-align:center">${esc(db.settings.address)}<br>${esc(db.settings.phone)}</p><hr><p>Invoice ${b.id} · Table ${b.table}<br>${new Date(b.createdAt).toLocaleString()}</p><table>${b.items.map(i=>`<tr><td>${esc(i.name)} × ${i.qty}</td><td class="right">${money(i.price*i.qty)}</td></tr>`).join('')}<tr><td>Subtotal</td><td class="right">${money(b.sub)}</td></tr><tr><td>GST (${b.gstPct}%)</td><td class="right">${money(b.gst)}</td></tr><tr><td>Service</td><td class="right">${money(b.svc)}</td></tr><tr><td>Tip${b.waiter?' ('+esc(b.waiter)+')':''}</td><td class="right">${money(b.tip)}</td></tr><tr><td><b>Total</b></td><td class="right"><b>${money(b.total)}</b></td></tr></table><p>Payment: ${esc(b.method)} · ${b.status}</p><p style="text-align:center">Thank you for dining with us!</p></div>`}
function printReceipt(id){let b=db.bills.find(x=>x.id===id);if(!b)return;let w=open('','_blank');if(!w){toast('Allow pop-ups to print.');return}w.document.write(`<html><head><title>Receipt ${b.id}</title><style>body{font:14px Arial;padding:24px;max-width:420px;margin:auto}table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid #ddd}.right{text-align:right}</style></head><body>${receiptHtml(b)}<script>print()<\/script></body></html>`);w.document.close()}
function resetDemo(){if(!confirm('Reset ALL demo data for every view?'))return;db=seed();save();render();toast('Demo data reset.')}

let page='dash',baseUrl=location.href.replace(/[^\/]*$/,'').replace(/\?.*$/,'')+'customer.html';
const NAV=[['dash','Overview'],['tables','Tables'],['qr','QR Codes'],['orders','All Orders'],['menu','Menu'],['staff','Staff'],['cash','Cashier Report'],['settings','Settings']];
const qrUrl=id=>baseUrl+'?table='+id;
function qrSvg(text){let q=new QRCode(-1,QRErrorCorrectLevel.M);q.addData(text);q.make();let n=q.getModuleCount(),r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))r+=`<rect x="${x+2}" y="${y+2}" width="1" height="1"/>`;return `<svg viewBox="0 0 ${n+4} ${n+4}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/>${r}</svg>`}
function qrModal(id){showModal(`<h2>Table ${id} QR</h2><div class="qrcell">${qrSvg(qrUrl(id))}<p class="small muted" style="word-break:break-all">${esc(qrUrl(id))}</p></div>`)}
function menuEd(id){let m=id?db.menu.find(x=>x.id===id):{name:'',category:'Main Course',price:0,emoji:'🍽️',desc:'',veg:true};showModal(`<h2>${id?'Edit':'Add'} item</h2><div class="field"><label>Name</label><input id="mN" value="${esc(m.name)}"></div><div class="formgrid"><div class="field"><label>Category</label><input id="mC" value="${esc(m.category)}"></div><div class="field"><label>Price</label><input id="mP" type="number" value="${m.price}"></div><div class="field"><label>Emoji</label><input id="mE" value="${esc(m.emoji)}"></div><div class="field"><label>Type</label><select id="mV"><option value="1" ${m.veg?'selected':''}>Veg</option><option value="0" ${!m.veg?'selected':''}>Non-veg</option></select></div></div><div class="field"><label>Description</label><textarea id="mD">${esc(m.desc)}</textarea></div><button onclick="saveMenu(${id||0})">Save</button>`)}
function saveMenu(id){let n=$('mN').value.trim(),p=Number($('mP').value);if(!n||!(p>=0)){toast('Enter name and price.');return}let vals={c:$('mC').value.trim()||'Other',e:$('mE').value||'🍽️',d:$('mD').value,v:$('mV').value==='1'};closeModal();tx(()=>{let m=id?db.menu.find(x=>x.id===id):{id:Math.max(0,...db.menu.map(x=>x.id))+1,available:true};Object.assign(m,{name:n,price:p,category:vals.c,emoji:vals.e,desc:vals.d,veg:vals.v});if(!id)db.menu.push(m)})}
function staffEd(id){showModal(`<h2>${id?'Edit':'Add'} employee</h2><div class="field"><label>Name</label><input id="sN" value="${id?esc(db.staff.find(x=>x.id===id).name):''}"></div><div class="field"><label>Role</label><select id="sR">${['Waiter','Kitchen','Manager'].map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Tables (comma separated)</label><input id="sT" value="${id?db.staff.find(x=>x.id===id).tables.join(','):''}"></div><button onclick="saveStaff(${id||0})">Save</button>`)}
function saveStaff(id){let n=$('sN').value.trim();if(!n)return;let v={name:n,role:$('sR').value,tables:$('sT').value.split(',').map(Number).filter(x=>x>0)};closeModal();tx(()=>{if(id)Object.assign(db.staff.find(x=>x.id===id),v);else db.staff.push({id:Math.max(0,...db.staff.map(x=>x.id))+1,...v})})}
function saveSettings(){tx(()=>Object.assign(db.settings,{restaurant:$('sn').value,address:$('sa').value,phone:$('sp').value,upi:$('su').value,gst:Number($('sg').value)||0,service:Number($('ss').value)||0}));toast('Saved.')}
function forceClear(id){if(tableBusy(id)&&!confirm('This table still has active orders or an unpaid bill. Force clear?'))return;tx(()=>{let t=getTable(id);t.status='Available';t.sid=null})}
function render(){let paid=db.bills.filter(b=>b.status==='Paid'),a=activeOrders(),rev=paid.reduce((s,b)=>s+b.total,0);$('nav').innerHTML='<div class="navlabel">MANAGER</div>'+NAV.map(([k,l])=>`<button class="navbtn ${page===k?'active':''}" onclick="page='${k}';render()">${l}</button>`).join('');
let P={dash:()=>head('Overview','Live snapshot of '+esc(db.settings.restaurant))+`<div class="grid">${stat('Tables occupied',db.tables.filter(t=>t.status==='Occupied').length+' / '+db.tables.length)}${stat('Active orders',a.length)}${stat('Pending approval',a.filter(o=>o.status==='Pending').length)}${stat('Paid revenue',money(rev))}</div><div class="section split"><div class="card"><h2>Live table map</h2><div class="tablegrid">${db.tables.map(t=>`<div class="tabletile ${t.status==='Occupied'?'occupied':'available'}"><div class="between"><b>Table ${t.id}</b><span class="status ${sc(t.status)}">${t.status}</span></div><p class="small muted">${tableActive(t.id).length} active · ${openBills(t.id).length?'💳 payment requested':''}</p></div>`).join('')}</div></div><div class="card"><h2>Recent alerts</h2><div class="list">${db.alerts.slice(-8).reverse().map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.message)}</p></div>`).join('')||'<div class="empty">No alerts.</div>'}</div></div></div>`,
tables:()=>head('Table Management','Seat, clear and get QR codes',`<button onclick="tx(()=>db.tables.push({id:Math.max(0,...db.tables.map(t=>t.id))+1,status:'Available',sid:null}))">+ Add table</button>`)+`<div class="tablegrid">${db.tables.map(t=>`<div class="tabletile ${t.status==='Occupied'?'occupied':'available'}"><div class="between"><b>Table ${t.id}</b><span class="status ${sc(t.status)}">${t.status}</span></div><div class="actions"><button class="secondary" onclick="qrModal(${t.id})">QR</button>${t.status==='Available'?`<button class="ghost" onclick="tx(()=>seatTable(${t.id}))">Seat</button>`:`<button class="ghost" onclick="forceClear(${t.id})">Clear</button>`}</div></div>`).join('')}</div>`,
qr:()=>head('Table QR Codes','Print and stick one on each table',`<button class="noprint" onclick="print()">Print all</button>`)+`<div class="card noprint"><div class="field"><label>Customer page URL (host customer.html online, then paste its address here)</label><input value="${esc(baseUrl)}" onchange="baseUrl=this.value.trim();render()"></div></div><div class="grid section">${db.tables.map(t=>`<div class="card qrcell">${qrSvg(qrUrl(t.id))}<h2>Table ${t.id}</h2><p class="small muted">Scan to view menu & order</p></div>`).join('')}</div>`,
orders:()=>head('All Orders','Every order placed')+`<div class="list">${db.orders.slice().reverse().map(o=>orderCard(o)).join('')||'<div class="empty">No orders.</div>'}</div>`,
menu:()=>head('Menu Management','Items and availability','<button onclick="menuEd()">+ Add item</button>')+`<div class="menuGrid">${db.menu.map(m=>`<div class="card"><div class="between"><b>${m.emoji} ${esc(m.name)}</b><span class="status ${m.available?'s-available':'s-cancelled'}">${m.available?'On':'Off'}</span></div><p class="small muted">${esc(m.category)} · ${m.veg?'Veg':'Non-veg'}</p><b>${money(m.price)}</b><div class="actions"><button class="secondary" onclick="menuEd(${m.id})">Edit</button><button class="ghost" onclick="tx(()=>{let m=db.menu.find(x=>x.id===${m.id});m.available=!m.available})">${m.available?'Disable':'Enable'}</button><button class="danger" onclick="confirm('Delete?')&&tx(()=>db.menu=db.menu.filter(x=>x.id!==${m.id}))">Delete</button></div></div>`).join('')}</div>`,
staff:()=>head('Staff','Directory and table assignments','<button onclick="staffEd()">+ Add employee</button>')+`<div class="list">${db.staff.map(s=>`<div class="item between"><div><h3>${esc(s.name)} · ${s.role}</h3><p>Tables: ${s.tables.join(', ')||'—'}</p></div><button class="secondary" onclick="staffEd(${s.id})">Edit</button></div>`).join('')}</div>`,
cash:()=>{let by={};paid.forEach(b=>by[b.method]=(by[b.method]||0)+b.total);let tips={};paid.forEach(b=>{if(b.waiter)tips[b.waiter]=(tips[b.waiter]||0)+b.tip});return head('Cashier Report','Payments recorded from customer bills','<button class="noprint" onclick="print()">Print</button>')+`<div class="grid">${stat('Total collected',money(rev))}${stat('Bills paid',paid.length)}${stat('Tips',money(paid.reduce((s,b)=>s+b.tip,0)))}${stat('GST collected',money(paid.reduce((s,b)=>s+b.gst,0)))}</div><div class="section split"><div class="card"><h2>All bills</h2><div class="list">${db.bills.slice().reverse().map(b=>`<div class="item between"><div><h3>#${b.id} · Table ${b.table}</h3><p>${new Date(b.createdAt).toLocaleString()} · ${esc(b.method)}</p><b>${money(b.total)}</b> <span class="status ${sc(b.status)}">${b.status}</span></div><button class="ghost noprint" onclick="showModal(receiptHtml(db.bills.find(x=>x.id===${b.id})))">View</button></div>`).join('')||'<div class="empty">No bills yet.</div>'}</div></div><div class="card"><h2>By payment method</h2>${Object.entries(by).map(([k,v])=>`<div class="between cartline"><span>${k}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">—</div>'}<h2 class="section">Tips by waiter</h2>${Object.entries(tips).map(([k,v])=>`<div class="between cartline"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">—</div>'}</div></div>`},
settings:()=>head('Settings','Restaurant and billing')+`<div class="card"><div class="formgrid"><div class="field"><label>Name</label><input id="sn" value="${esc(db.settings.restaurant)}"></div><div class="field"><label>Phone</label><input id="sp" value="${esc(db.settings.phone)}"></div><div class="field"><label>Address</label><input id="sa" value="${esc(db.settings.address)}"></div><div class="field"><label>UPI ID</label><input id="su" value="${esc(db.settings.upi)}"></div><div class="field"><label>GST %</label><input id="sg" type="number" value="${db.settings.gst}"></div><div class="field"><label>Service charge %</label><input id="ss" type="number" value="${db.settings.service}"></div></div><button onclick="saveSettings()">Save</button></div>`};
$('app').innerHTML=P[page]()}
setInterval(processReminders,15000);

render();
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString()},5000);
</script></body></html>
